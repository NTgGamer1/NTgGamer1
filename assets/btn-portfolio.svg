<svg width="180" height="48" viewBox="0 0 180 48" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#A371F7"/>
      <stop offset="1" stop-color="#58A6FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect x="4" y="4" width="172" height="40" rx="20" fill="none" stroke="url(#b)" stroke-width="3" filter="url(#glow)" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.85;0.3" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="4" y="4" width="172" height="40" rx="20" fill="#0D1117" stroke="url(#b)" stroke-width="1.6"/>
  <text x="20" y="30" font-size="14" font-weight="700" fill="#58A6FF">&lt;/&gt;</text>
  <text x="58" y="29" font-size="14" font-weight="600" fill="#E6EDF3">portfolio</text>
</svg>
